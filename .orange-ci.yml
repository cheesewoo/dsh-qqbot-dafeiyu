$:
  tag_push:
    - services:
        - docker
      docker:
        image: node:24
      runner:
        network: devnet
      stages:
        - name: 安装依赖
          script: npm install
        - name: 构建项目
          script: npm run build
        - name: 配置 npm 官方源
          script: npm config set registry https://registry.npmjs.org
        - name: 配置 token
          imports: https://git.woa.com/qq-ai/web/secret/blob/master/envs/npm/npmjs.txt
          script: npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN
        - name: 设置 npm 包版本号
          script: npm version ${ORANGE_BRANCH} --no-git-tag-version --allow-same-version
        - name: 发布 npm 包
          script: npm publish --access public
        - name: 生成通知
          script: echo "@tencent-connect/dsh-qqbot@${ORANGE_BRANCH} 发布成功" > message.txt
        - name: 发送通知
          type: wework:message
          options:
            fromFile: message.txt

# ── master 分支：MR 检查 ──
master:
  merge_request:
    - docker:
        image: node:24
      wework:
        silent: true
      stages:
        - name: 安装依赖
          script: npm install
        - name: TypeScript 类型检查
          script: npx tsc --noEmit

# ── feat/fix 分支 push：内网发布 dev 版本 ──
(feat|fix)/**:
  push:
    - docker:
        image: node:24
      runner:
        network: devnet
      stages:
        - name: 安装依赖
          script: npm install
        - name: 构建项目
          script: npm run build
        - name: 设置测试包名
          script: npm run ci:prepare-test-pkg
        - name: 设置测试版本
          script: npm version "0.0.0-dev.${ORANGE_COMMIT_SHORT}" --no-git-tag-version
        - name: 发布 npm 包
          image: tencentcom/npm:latest
          imports: https://git.woa.com/qq-ai/web/secret/blob/master/envs/npm/public.txt
          settings:
            username: $USER
            password: $PWD
            email: $EMAIL
            registry: https://mirrors.tencent.com/npm/
            folder: ./
            tag: dev
