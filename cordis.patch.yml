# dsh-im-qqbot bundle patch
#
# 当本包通过 `dsh plugin --profile <name> add dsh-qqbot-dafeiyu` 安装后，
# dsh 启动时自动加载此 patch。
#
# 环境变量：
#   QQBOT_APPID  - QQ Bot AppID（必填）
#   QQBOT_SECRET - QQ Bot AppSecret（必填）
#
# 叠加顺序：dsh-base → 本 bundle patch → profile cordis.patch.yml → --patch

# ── 插入 im-qqbot 插件行 ──
- insert:
    - id: im-qqbot
      disabled: true
      name: 'dsh-qqbot-dafeiyu'
      config:
        appId: __FROM_ENV__
        appSecret: __FROM_ENV__
        # provider/model 留空：从宿主默认模型路由继承
        # 用户可通过 /model 命令在聊天中切换
        requireMention: true
        textChunkLimit: 4500
        sessionIdleTimeout: 1800000
        maxQueue: 20
        processingTimeoutMs: 120000
        historyLimit: 10
        access:
          # 安全默认：白名单模式 + 空名单 = 全部拒绝（不是"放行所有人"）。
          # 要让指定的人/群能用，把 openid 填进下面的列表；要对外完全开放，需显式写 open。
          c2cMode: allowlist
          c2cAllow: []
          groupMode: allowlist
          groupAllow: []
        debug: false